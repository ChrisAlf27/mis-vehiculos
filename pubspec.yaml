name: vehiculos_app
description: Registro de mantenimiento de vehículos - Vehicle Maintenance Tracker
publish_to: 'none'
version: 1.4.1+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Base de datos local
  sqflite: ^2.3.2
  path: ^1.9.0

  # Notificaciones locales
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Exportación
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.15.1

  # Archivos y permisos
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  share_plus: ^10.1.4

  # UI
  intl: ^0.20.3
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8
  flutter_timezone: ^5.1.0
  file_picker: ^10.3.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
